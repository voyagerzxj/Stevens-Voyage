<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#1e3a8a"/>
  <!-- Globe body -->
  <circle cx="32" cy="32" r="22" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5"/>
  <!-- Latitude lines -->
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <line x1="13" y1="22" x2="51" y2="22" stroke="#93c5fd" stroke-width="1" opacity="0.4"/>
  <line x1="13" y1="42" x2="51" y2="42" stroke="#93c5fd" stroke-width="1" opacity="0.4"/>
  <!-- Longitude lines -->
  <ellipse cx="32" cy="32" rx="11" ry="22" fill="none" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <line x1="32" y1="10" x2="32" y2="54" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <!-- Globe outline -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#bfdbfe" stroke-width="1.5"/>
  <!-- Letter S -->
  <text x="32" y="38" font-family="Georgia, serif" font-size="18" font-weight="bold"
        fill="white" text-anchor="middle" opacity="0.95">S</text>
</svg>
